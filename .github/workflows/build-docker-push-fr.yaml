---
name: FR Build Push

on:
  push:
    branches:
      - master
      - staging   # Added staging branch
    paths:
      - 'frontend/**'  # Trigger on changes in the frontend directory.
      - '.github/workflows/build-docker-push-fr.yaml'
      - '!frontend/**/*.md'  # Exclude Markdown files from triggering the workflow.
  workflow_dispatch:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}

jobs:
  frontend-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Node Code
        working-directory: ./frontend
        run: |
          npm install
          # Replace with your actual test command (e.g., npm run test)
          echo "Running frontend tests..."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Local Load)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: nasat-frontend:test

      - name: Test Docker Container
        run: |
          # Provide placeholder DNS entries so Nginx can parse the Kubernetes
          # backend and MinIO upstreams during this outside-cluster smoke test.
          docker run -d -p 8080:80 \
            --add-host backend:127.0.0.1 \
            --add-host minio:127.0.0.1 \
            --name frontend-test nasat-frontend:test
          sleep 5 # Wait for Nginx to start
          container_running=$(docker inspect -f '{{.State.Running}}' frontend-test)
          if [ "$container_running" != "true" ]; then
            echo "Frontend container crashed on startup"
            docker logs frontend-test
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/nasat-frontend:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/nasat-frontend:${{ github.sha }}

      - name: Update K8s Image Tag in Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

          git pull origin ${{ github.ref_name }} --rebase

          # 2. Now apply the image tag update
          image_prefix='${{ env.IMAGE_PREFIX }}'
          image_tag='${{ github.sha }}'
          sed -i "s|image: ${image_prefix}/nasat-frontend:.*|image: ${image_prefix}/nasat-frontend:${image_tag}|g" \
            k8s/frontend/Frontend.yaml

          git add k8s/frontend/Frontend.yaml
          git commit -m "chore: update frontend image tag to ${{ github.sha }}"

          git pull origin ${{ github.ref_name }} --rebase
          git push origin ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
