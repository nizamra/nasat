apiVersion: apps/v1
kind: Deployment
metadata:
  name: infisical
  namespace: infisical
  labels:
    app: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infisical
  template:
    metadata:
      labels:
        app: infisical
    spec:
      containers:
        - name: infisical
          image: infisical/infisical:v0.164.1
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: SITE_URL
              value: "http://infisical.nasat.local"
            - name: REDIS_URL
              value: "redis://redis.infisical.svc.cluster.local:6379"
            - name: PORT
              value: "8080"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: infisical-secrets
                  key: ENCRYPTION_KEY
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: infisical-secrets
                  key: AUTH_SECRET
            - name: DB_CONNECTION_URI
              valueFrom:
                secretKeyRef:
                  name: infisical-secrets
                  key: DB_CONNECTION_URI

          # Startup probe allows up to 150 seconds (30 * 5s) for full initialization
          startupProbe:
            httpGet:
              path: /api/status
              port: 8080
            periodSeconds: 5
            failureThreshold: 40
            initialDelaySeconds: 10

          livenessProbe:
            httpGet:
              path: /api/status
              port: 8080
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/status
              port: 8080
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
