apiVersion: batch/v1
kind: Job
metadata:
  name: infisical-db-migration
  namespace: infisical
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-migration
          image: infisical/infisical:v0.164.1
          command: ["npm", "run", "migration:latest"]
          env:
            - name: NODE_ENV
              value: "production"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: infisical-secrets
                  key: ENCRYPTION_KEY
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: infisical-secrets
                  key: AUTH_SECRET
            - name: DB_CONNECTION_URI
              valueFrom:
                secretKeyRef:
                  name: infisical-secrets
                  key: DB_CONNECTION_URI
            - name: REDIS_URL
              value: "redis://redis.infisical.svc.cluster.local:6379"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
