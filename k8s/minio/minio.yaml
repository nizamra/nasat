apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      initContainers:
        # Create bucket directory
        - name: create-bucket
          image: busybox:1.36
          command: ['sh', '-c', 'mkdir -p /data/nasat-media']
          volumeMounts:
            - name: minio-data
              mountPath: /data
      
      containers:
        - name: minio
          image: minio/minio
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
            # Enable CORS globally for the MinIO API
            - name: MINIO_API_CORS_ALLOW_ORIGIN
              value: "*"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: minio-data
              mountPath: /data
        
        # Sidecar to automatically set bucket policy and CORS
        - name: setup-bucket-policy
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              # Wait for MinIO to be ready
              until mc alias set local http://localhost:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} 2>/dev/null; do
                echo "Waiting for MinIO to start..."
                sleep 2
              done
              
              # Create bucket and set public download policy
              mc mb --ignore-existing local/nasat-media
              mc anonymous set download local/nasat-media
              
              # # Set CORS configuration for the bucket
              # echo '{
              #   "CORSRules": [
              #     {
              #       "AllowedOrigins": ["*"],
              #       "AllowedMethods": ["GET", "HEAD", "PUT", "POST", "DELETE"],
              #       "AllowedHeaders": ["*"],
              #       "ExposeHeaders": ["ETag", "x-amz-request-id", "x-amz-id-2", "x-amz-version-id"],
              #       "MaxAgeSeconds": 3600
              #     }
              #   ]
              # }' | mc anonymous set-json local/nasat-media
              echo "MinIO bucket nasat-media is now public."
              
              # Keep container running
              sleep infinity
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin

      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc
