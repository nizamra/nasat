apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      initContainers:
        # Create bucket directory
        - name: create-bucket
          image: busybox:1.36
          command: ['sh', '-c', 'mkdir -p /data/nasat-media']
          volumeMounts:
            - name: minio-data
              mountPath: /data
        
        # Wait for MinIO and set bucket policy
        - name: setup-bucket-policy
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              # Wait for MinIO API to be available
              until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} 2>/dev/null; do
                echo "Waiting for MinIO service..."
                sleep 2
              done
              
              # Create bucket and set policy
              mc mb --ignore-existing local/nasat-media
              mc policy set download local/nasat-media
              
              echo "MinIO bucket nasat-media is now public"
              exit 0
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
      
      containers:
        - name: minio
          image: minio/minio
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc
