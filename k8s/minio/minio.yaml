apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      initContainers:
        # Create bucket directory
        - name: create-bucket
          image: busybox:1.36
          command: ['sh', '-c', 'mkdir -p /data/nasat-media']
          volumeMounts:
            - name: minio-data
              mountPath: /data
      
      containers:
        - name: minio
          image: minio/minio
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
            - name: MINIO_BUCKET
              value: nasat-media
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: minio-data
              mountPath: /data
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Wait for MinIO to be ready
                    until curl -s http://localhost:9000/minio/health/live; do
                      echo "Waiting for MinIO to start..."
                      sleep 2
                    done
                    
                    # Install mc client and configure
                    wget https://dl.min.io/client/mc/release/linux-amd64/mc -O /usr/local/bin/mc
                    chmod +x /usr/local/bin/mc
                    mc alias set local http://localhost:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD
                    mc mb --ignore-existing local/nasat-media
                    mc policy set download local/nasat-media
                    echo "MinIO bucket nasat-media is now public"
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc
