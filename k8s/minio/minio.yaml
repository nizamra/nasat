apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      # nodeSelector:
      #   node-role.kubernetes.io/worker: worker

      initContainers:
        - name: create-bucket
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /data/nasat-media /data/longhorn-backups
          volumeMounts:
            - name: minio-data
              mountPath: /data

      containers:
        - name: minio
          image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
            - name: MINIO_API_CORS_ALLOW_ORIGIN
              value: "*"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: minio-data
              mountPath: /data

        # Sidecar to automatically set bucket policy and CORS
        - name: setup-bucket-policy
          image: docker.io/netiedge/minio-mc:RELEASE.2025-01-17T23-25-50Z
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set local http://localhost:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}" 2>/dev/null; do
                echo "Waiting for MinIO to start..."
                sleep 2
              done

              mc mb --ignore-existing local/nasat-media
              mc anonymous set download local/nasat-media

              echo "MinIO bucket nasat-media is now public."
              sleep infinity
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin

      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc-longhorn