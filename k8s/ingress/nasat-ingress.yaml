apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nasat-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  rules:
    - host: nasat.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
