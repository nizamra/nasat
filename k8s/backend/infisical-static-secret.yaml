apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: backend-static-secret
  namespace: nasat
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  infisicalAuthRef:
    name: backend-auth
    namespace: nasat
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: nasat-backend
      environmentSlug: prod
      secretPath: "/"
  targets:
    - name: backend-secrets
      namespace: nasat
      kind: Secret
      creationPolicy: Owner
