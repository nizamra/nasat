apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-database-bootstrap-script
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    export PGPASSWORD="${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

    case "$POSTGRES_DB" in
      ""|*[!a-zA-Z0-9_]*)
        echo "ERROR: POSTGRES_DB must contain only letters, digits, and underscores" >&2
        exit 1
        ;;
    esac

    echo "Waiting for PostgreSQL to accept connections..."
    attempt=0
    until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d template1; do
      attempt=$((attempt + 1))
      if [ "$attempt" -ge 60 ]; then
        echo "ERROR: PostgreSQL did not become ready within 5 minutes" >&2
        exit 1
      fi
      sleep 5
    done

    role_flags="$(psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d template1 -v ON_ERROR_STOP=1 -Atc \
      "SELECT rolsuper::text || ':' || rolcreatedb::text FROM pg_roles WHERE rolname = current_user")"
    if [ -z "$role_flags" ]; then
      echo "ERROR: PostgreSQL role '$POSTGRES_USER' does not exist or credentials were rejected" >&2
      exit 1
    fi
    case "$role_flags" in
      true:*|*:true) ;;
      *)
        echo "ERROR: PostgreSQL role '$POSTGRES_USER' needs CREATEDB or SUPERUSER to create '$POSTGRES_DB'" >&2
        exit 1
        ;;
    esac

    # The identifier check above makes this SQL literal safe to interpolate.
    database_exists="$(psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d template1 -v ON_ERROR_STOP=1 -At \
      -c "SELECT 1 FROM pg_database WHERE datname = '$POSTGRES_DB'")"

    if [ "$database_exists" = "1" ]; then
      echo "Database '$POSTGRES_DB' already exists; nothing to do."
      exit 0
    fi

    echo "Creating database '$POSTGRES_DB' owned by '$POSTGRES_USER'."
    createdb -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" \
      --template=template1 --owner="$POSTGRES_USER" "$POSTGRES_DB"
    echo "Database '$POSTGRES_DB' is ready."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-database-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: postgres-database-bootstrap
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: postgres:16
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          volumeMounts:
            - name: bootstrap-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: bootstrap-script
          configMap:
            name: postgres-database-bootstrap-script
            defaultMode: 0444
