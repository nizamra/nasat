apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-pg-hba
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  pg_hba.conf: |
    # Local administration from inside the PostgreSQL container.
    local   all             all                                     trust
    local   replication     all                                     trust

    # Password-authenticated access for the application from any reachable IP.
    host    nasat           nasat           0.0.0.0/0               scram-sha-256
    host    nasat           nasat           ::/0                    scram-sha-256

    # The bootstrap Job uses template1 to create nasat when it is missing.
    host    template1       nasat           0.0.0.0/0               scram-sha-256
    host    template1       nasat           ::/0                    scram-sha-256
