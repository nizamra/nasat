apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jspwiki-ingress
  namespace: jspwiki
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
spec:
  rules:
    - host: jspwiki.nasat.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jspwiki
                port:
                  number: 80
