apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
  labels:
    app: pihole
    tier: application
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 0
  selector:
    matchLabels:
      app: pihole
  strategy:
    type: Recreate # Use Recreate since we use ReadWriteOnce PVC
  template:
    metadata:
      labels:
        app: pihole
        tier: application
      annotations:
        prometheus.io/scrape: "false"
    spec:
      # Ensure pods run on worker nodes only
      nodeSelector:
        node-role.kubernetes.io/worker: worker

      # Pod disruption budget for graceful shutdowns
      terminationGracePeriodSeconds: 30

      containers:
        - name: pihole
          image: pihole/pihole:2026.05.0
          imagePullPolicy: IfNotPresent

          # Security context
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - NET_ADMIN
                - NET_BIND_SERVICE
                - SYS_NICE
                - CHOWN

          ports:
            # DNS queries (UDP)
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            # DNS queries (TCP)
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            # DHCP (optional - disabled by default)
            - name: dhcp
              containerPort: 67
              protocol: UDP
            # Admin interface
            - name: http
              containerPort: 80
              protocol: TCP
            # HTTPS admin
            - name: https
              containerPort: 443
              protocol: TCP

          # Load environment from ConfigMap
          envFrom:
            - configMapRef:
                name: pihole-config

          # Additional environment variables
          env:
            - name: PIHOLE_UID
              value: "999"
            - name: PIHOLE_GID
              value: "999"

          # Volume mounts
          volumeMounts:
            - name: pihole-config
              mountPath: /etc/pihole
            - name: pihole-dnsmasq
              mountPath: /etc/dnsmasq.d
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run

          # Resource requests and limits
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Startup probe: give Pi-hole time to initialize (up to 2 minutes)
          startupProbe:
            httpGet:
              path: /admin/
              port: http
            failureThreshold: 12
            periodSeconds: 10

          # Liveness probe: restart if unhealthy
          livenessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe: don't accept traffic until ready
          readinessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

      # Volumes
      volumes:
        - name: pihole-config
          persistentVolumeClaim:
            claimName: pihole-config
        - name: pihole-dnsmasq
          persistentVolumeClaim:
            claimName: pihole-dnsmasq
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
