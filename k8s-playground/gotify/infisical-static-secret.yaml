apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: gotify-static-secret
  namespace: gotify
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  infisicalAuthRef:
    name: gotify-auth
    namespace: gotify
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: gotify
      environmentSlug: staging
      secretPath: "/"
  targets:
    - name: gotify-secrets
      namespace: gotify
      kind: Secret
      creationPolicy: Owner
