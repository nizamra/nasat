apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com
              icon: github
        - Project Docs:
            - abbr: Docs
              href: https://github.com/nizamra/nasat
              icon: mdi-text-box-multiple
        - Tailscale:
            - abbr: TS
              href: https://console.tailscale.com/admin/machines
              icon: mdi-vpn
    - Social:
        - SawSan:
            - abbr: SW
              href: https://www.instagram.com/direct/t/17849074092606140/
              icon: mdi-instagram
        - Doaa:
            - abbr: DO
              href: https://www.instagram.com/direct/t/17843496342556189/
              icon: mdi-instagram

  services.yaml: |
    # === CORE INFRASTRUCTURE ===
    - 🏗️ Infrastructure:
        - ArgoCD:
            href: http://argo.nasat.local
            description: GitOps Deployment
            icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/argo-cd.png
            kubernetes:
              - namespace: argocd
                app.kubernetes.io/name: argocd-server
        - Grafana:
            href: http://grafana.nasat.local
            description: Metrics & Monitoring Dashboards
            icon: grafana
            kubernetes:
              - namespace: monitoring
                app.kubernetes.io/name: grafana
        - Longhorn:
            href: http://longhorn.nasat.local
            description: Distributed Block Storage
            icon: mdi-harddisk
        - Infisical:
            href: http://infisical.nasat.local
            description: Secrets Management & Vault
            icon: mdi-lock-open-outline
            kubernetes:
              - namespace: infisical
                app: infisical
        - Longhorn:
            href: http://longhorn.nasat.local
            description: Distributed Block Storage
            icon: mdi-harddisk

    - 🚀 Playground Apps:
        - Homepage:
            href: http://homepage.nasat.local
            description: Local dashboard and landing page
            icon: mdi-home
            kubernetes:
              - namespace: homepage
                app: homepage
        - Immich:
            href: http://immich.nasat.local
            description: Photo & Video Backup Library
            icon: mdi-image-multiple
            kubernetes:
              - namespace: immich
                app: immich
        - Gotify:
            href: http://gotify.nasat.local
            description: Push Notification System
            icon: gotify
            kubernetes:
              - namespace: gotify
                app: gotify

    - 📌 Useful Links:
        - GitHub:
            href: https://github.com/nizamra/nasat
            description: Project repository
            icon: github
        - NASAT Docs:
            href: https://github.com/nizamra/nasat
            description: Project documentation and source
            icon: mdi-text-box-multiple

  widgets.yaml: |
    - search:
        provider: duckduckgo
        target: _blank

    - datetime:
        text_size: xl
        format:
          timeStyle: short
          hourCycle: h23
          dateStyle: medium

    - greeting:
        text_size: xl
        text: "NASAT"
        random: true

    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: k3s-cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    - openmeteo:
        label: Ramallah
        latitude: 31.9038
        longitude: 35.2034
        units: metric
        cache: 5

  settings.yaml: |
    title: NASAT Dashboard
    subtitle: "Homelab Playground Stack - Kubernetes Cluster Management"
    favicon: "https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes.png"
    theme: dark
    color: slate
    background:
      image: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop"
      blur: sm
      brightness: 50
      saturate: 75
      # blur: md
      # brightness: 40
      # saturate: 80
      # opacity: 0.9
    layout:
      header:
        title: true
        icon: true
        colorIcon: true
      cards:
        columns: 2
        style: row
        animation: pulse
    providers:
      longurl: false
    usebookmarks: true
    bookmarks_limit: 6
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      hideVisitURL: true
    hideVersion: false

  kubernetes.yaml: |
    mode: cluster
    ingress: true
    namespace: homepage
