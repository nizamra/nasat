# Secret for FreshRSS initial admin credentials
# Change these in production
apiVersion: v1
kind: Secret
metadata:
  name: freshrss-secrets
  namespace: freshrss
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  FRESHRSS_ADMIN_USER: "admin"
  FRESHRSS_ADMIN_PASSWORD: "changeme_set_strong_password"
