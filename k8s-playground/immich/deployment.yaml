apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
  namespace: immich
  labels:
    app: immich
    tier: application
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: immich
        tier: application
      annotations:
        immich.nasat.local/machine-learning: "disabled"
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: worker
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: initialize-storage
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              for directory in thumbs upload backups library profile encoded-video; do
                mkdir -p "/data/${directory}"
                touch "/data/${directory}/.immich"
              done
          volumeMounts:
            - name: immich-data
              mountPath: /data
      containers:
        - name: immich
          image: ghcr.io/immich-app/immich-server:v3.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2283
              protocol: TCP
          envFrom:
            - configMapRef:
                name: immich-config
            - secretRef:
                name: immich-secrets
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: JWT_SECRET
          volumeMounts:
            - name: immich-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 400Mi
            limits:
              cpu: 1300m
              memory: 960Mi
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: immich-data
          persistentVolumeClaim:
            claimName: immich-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-db
  namespace: immich
  labels:
    app: immich-db
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: immich-db
        tier: database
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: worker
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvector0.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: immich-db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 800m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d immich
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d immich
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: immich-db-data
          persistentVolumeClaim:
            claimName: immich-db-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  namespace: immich
  labels:
    app: immich-redis
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-redis
  template:
    metadata:
      labels:
        app: immich-redis
        tier: cache
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: worker
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
