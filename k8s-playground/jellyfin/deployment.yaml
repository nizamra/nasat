apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
    tier: application
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 0
  selector:
    matchLabels:
      app: jellyfin
  strategy:
    type: Recreate # Use Recreate since we use ReadWriteOnce PVCs
  template:
    metadata:
      labels:
        app: jellyfin
        tier: application
    spec:
      # Ensure pods run on worker nodes only
      nodeSelector:
        node-role.kubernetes.io/worker: worker

      terminationGracePeriodSeconds: 30

      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.11.8
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            # Jellyfin needs to write to volumes
            readOnlyRootFilesystem: false

          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
            - name: discovery
              containerPort: 7359
              protocol: UDP

          # Load environment from ConfigMap
          envFrom:
            - configMapRef:
                name: jellyfin-config

          # Additional environment variables
          env:
            - name: TZ
              value: "UTC"

          # Volume mounts
          volumeMounts:
            # Config and cache volume
            - name: jellyfin-config
              mountPath: /config
            # Media library volume
            - name: jellyfin-media
              mountPath: /media
            # Transcoding temporary storage
            - name: jellyfin-cache
              mountPath: /cache

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi

          # Startup probe - Jellyfin can take time to start
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 10

          # Liveness probe
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2

      volumes:
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: jellyfin-media
          persistentVolumeClaim:
            claimName: jellyfin-media
        # Temporary storage for transcoding - faster if not using PVC
        - name: jellyfin-cache
          emptyDir:
            sizeLimit: 10Gi
