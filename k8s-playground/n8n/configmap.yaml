# ConfigMap for n8n environment configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-config
  namespace: n8n
data:
  # n8n loads these as environment variables
  N8N_PROTOCOL: "https"
  N8N_HOST: "n8n.nasat.local"
  N8N_PORT: "5678"
  N8N_PATH: "/"
  N8N_SECURE_COOKIE: "true"
  # Database configuration (internal SQLite for simplicity)
  DB_TYPE: "sqlite"
  # Execution mode
  EXECUTION_MODE: "regular"
  # Workflow execution settings
  N8N_EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
  N8N_EXECUTIONS_DATA_SAVE_ON_SUCCESS: "all"
  N8N_EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
