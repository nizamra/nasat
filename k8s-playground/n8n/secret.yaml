# Secret for n8n credentials and sensitive data
# In production, use sealed-secrets or external-secrets
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
  namespace: n8n
type: Opaque
stringData:
  # Generate a strong random key in production
  # openssl rand -base64 32
  N8N_ENCRYPTION_KEY: "changeme_generate_secure_key_in_production"
  # API key for webhook authentication
  N8N_WEBHOOK_URL: "https://n8n.nasat.local/webhook"
