apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app: n8n
    tier: application
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: n8n
        tier: application
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5678"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: worker

      terminationGracePeriodSeconds: 30
      serviceAccountName: n8n

      initContainers:
        - name: fix-data-permissions
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              echo "Setting permissions for /home/node/.n8n"
              mkdir -p /home/node/.n8n
              chown -R 1000:1000 /home/node/.n8n
              chmod -R 775 /home/node/.n8n
              echo "Permissions set. Listing directory:"
              ls -la /home/node/.n8n
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n

      containers:
        - name: n8n
          image: n8nio/n8n:1.123.55
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 1000
            runAsGroup: 1000

          ports:
            - name: http
              containerPort: 5678
              protocol: TCP

          envFrom:
            - configMapRef:
                name: n8n-config
            - secretRef:
                name: n8n-secrets

          env:
            - name: NODE_ENV
              value: "production"
            - name: GENERIC_TIMEZONE
              value: "UTC"

          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2

      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
