server {
  listen 80;

  # The UI advertises 5 MB avatar uploads; allow extra room for multipart overhead.
  client_max_body_size 10m;

  # Preserve the browser's host and NodePort so Django can build reachable URLs.
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Proxy API and Django admin requests to the internal backend Service.
  location /api {
    proxy_pass http://backend:8000;
  }

  location /admin {
    proxy_pass http://backend:8000;
  }

  location /static {
    proxy_pass http://backend:8000;
  }

  # Strip /media/ before forwarding; MinIO expects /<bucket>/<object>.
  location /media/ {
    proxy_pass http://minio:9000/;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;

    # React SPA fallback
    try_files $uri $uri/ /index.html;
  }
}
