---
- name: Allow passwordless sudo for the Ansible user
  hosts: all
  become: true

  tasks:
    - name: Create sudoers rule
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-ansible
        content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
