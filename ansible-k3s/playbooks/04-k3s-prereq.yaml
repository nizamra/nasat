---
- name: Host prerequisites for K3s and Longhorn
  hosts: all
  become: true

  tasks:
    - name: Install storage dependencies
      ansible.builtin.apt:
        name: [open-iscsi, nfs-common, ca-certificates]
        state: present
        update_cache: true
        lock_timeout: 120

    - name: Enable and start iSCSI daemon (Longhorn requirement)
      ansible.builtin.systemd:
        name: iscsid
        enabled: true
        state: started
