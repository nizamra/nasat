apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.12.1
    releaseName: longhorn
    namespace: longhorn-system
    valuesFile: longhorn-values.yaml

resources:
  - resources/backup-secret.yaml
  - resources/recurringjobs.yaml
  - resources/storageclasses.yaml

patches:
  - path: patch-csi-plugin-prestop.yaml
