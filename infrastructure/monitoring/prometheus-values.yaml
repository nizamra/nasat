prometheus:
  prometheusSpec:
    scrapeInterval: "40s"
    evaluationInterval: "60s"
    retention: "7d"
    retentionSize: "6GB"
    replicas: 1
    containers:
      - name: prometheus
        env:
          - name: GOGC
            value: "50"
    resources:
      requests:
        cpu: "50m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1280Mi"

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - prometheus.nasat.local
    path: /
    pathType: Prefix

kubeApiServer:
  enabled: true
  serviceMonitor:
    sampleLimit: 28000
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__, le]
        regex: '(etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?'
      - action: drop
        sourceLabels: [__name__]
        regex: '(apiserver_request_body_size_bytes|apiserver_response_sizes|apiserver_watch_events_sizes|apiserver_request_slo_duration_seconds|apiserver_admission_controller_admission_duration_seconds|apiserver_admission_step_admission_duration_seconds|apiserver_admission_webhook_admission_duration_seconds|apiserver_flowcontrol_request_wait_duration_seconds|apiserver_flowcontrol_request_execution_seconds|workqueue_queue_duration_seconds|workqueue_work_duration_seconds|rest_client_request_duration_seconds|rest_client_rate_limiter_duration_seconds|rest_client_request_size_bytes|rest_client_response_size_bytes|apiserver_request_duration_seconds|apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|storage_operation_duration_seconds|scheduler_[a-z_]+)_bucket'

defaultRules:
  rules:
    alertmanager: true
    general: true
    kubeApiserverAvailability: false
    kubeApiserverSlos: false
    kubeApiserverBurnrate: false
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    network: false
    prometheus: true
    prometheusOperator: true
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false
    etcd: false

additionalPrometheusRulesMap:
  nasat-worker:
    groups:
      - name: nasat-worker
        interval: 30s
        rules:
          - alert: WorkerUnreachable
            expr: up{job="node-exporter", instance="192.168.10.20:9100"} == 0
            for: 1m
            keep_firing_for: 10m
            labels:
              severity: critical
            annotations:
              summary: Worker node is unreachable
              description: >-
                Prometheus has not been able to scrape the worker for over a minute.
                A power cut is the most likely cause.
          - alert: WorkerTargetMissing
            expr: absent(up{job="node-exporter", instance="192.168.10.20:9100"})
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: The worker's node-exporter target does not exist
              description: >-
                No up series for 192.168.10.20:9100 for 10 minutes. The worker's IP may have changed
                or the node was removed; WorkerUnreachable cannot fire until this is fixed.

grafana:
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
    accessModes: ["ReadWriteOnce"]
  adminPassword: "J2T9UY9RrlkAp-sj"
  nodeSelector:
    node-role.kubernetes.io/master: master
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.nasat.local
    path: /
    pathType: Prefix
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6

  livenessProbe:
    timeoutSeconds: 10
    
# Alertmanager. Runs on master so it can still notify while the worker is down.
# The Telegram token/chat id and the Healthchecks ping URL come from the Secret
# `alertmanager-secrets` (synced from Infisical project "monitoring", env "prod").
alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    nodeSelector:
      node-role.kubernetes.io/master: master
    secrets:
      - alertmanager-secrets
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: telegram
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Heartbeat: Watchdog always fires; pinging Healthchecks every ~2 minutes proves the
        # whole chain (Prometheus -> Alertmanager -> internet) is alive.
        - receiver: healthchecks
          matchers: ['alertname = "Watchdog"']
          group_wait: 0s
          group_interval: 2m
          repeat_interval: 1m
        # Worker outage: one message, no repeats while it stays down, no "resolved" message.
        - receiver: telegram-once
          matchers: ['alertname = "WorkerUnreachable"']
          group_wait: 0s
          repeat_interval: 8760h
        - receiver: 'null'
          matchers: ['alertname =~ "AlertmanagerFailedToSendAlerts|AlertmanagerClusterFailedToSendAlerts"']
        # Info-level alerts and the InfoInhibitor helper are not worth a notification.
        - receiver: 'null'
          matchers: ['severity =~ "info|none"']
    inhibit_rules:
      # While the worker is down, mute the warnings its outage causes (not-ready pods,
      # TargetDown, DaemonSet and replica mismatches). Critical alerts still get through.
      - source_matchers: ['alertname = "WorkerUnreachable"']
        target_matchers: ['severity = "warning"']
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity =~ "warning|info"']
        equal: ['namespace', 'alertname']
    receivers:
      - name: 'null'
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-secrets/TELEGRAM_BOT_TOKEN
            chat_id_file: /etc/alertmanager/secrets/alertmanager-secrets/TELEGRAM_CHAT_ID
            send_resolved: true
      - name: telegram-once
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-secrets/TELEGRAM_BOT_TOKEN
            chat_id_file: /etc/alertmanager/secrets/alertmanager-secrets/TELEGRAM_CHAT_ID
            send_resolved: false
      - name: healthchecks
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-secrets/HEALTHCHECKS_PING_URL
            send_resolved: false

# K3s Control Plane Disables
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
windowsMonitoring:
  enabled: false
kubeEtcd:
  enabled: false
kubeDns:
  enabled: false
coreDns:
  enabled: true

nodeExporter:
  enabled: true
  nodeSelector: {}
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 64Mi

# K3s Kubelet Scrape Configuration
kubelet:
  enabled: true
  namespace: kube-system
  serviceMonitor:
    https: true
    insecureSkipVerify: true

    cAdvisorMetricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: '(container_tasks_state|container_memory_failures_total|container_sockets|container_threads|container_blkio_device_usage|container_file_descriptors|container_cpu_load_average_10s|container_fs_reads_total|container_fs_writes_total|container_fs_inodes_total|container_spec_.*)'

# kubeStateMetrics:
#   enabled: false
