prometheus:
  prometheusSpec:
    scrapeInterval: "40s"
    evaluationInterval: "60s"
    retention: "7d"
    retentionSize: "6GB"
    replicas: 1
    containers:
      - name: prometheus
        env:
          - name: GOGC
            value: "50"
    resources:
      requests:
        cpu: "50m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1280Mi"

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - prometheus.nasat.local
    path: /
    pathType: Prefix

kubeApiServer:
  enabled: true
  serviceMonitor:
    sampleLimit: 50000
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__, le]
        regex: '(etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?'
      - action: drop
        sourceLabels: [__name__]
        regex: '(apiserver_request_body_size_bytes|apiserver_response_sizes|apiserver_watch_events_sizes|apiserver_request_slo_duration_seconds|apiserver_admission_controller_admission_duration_seconds|apiserver_admission_step_admission_duration_seconds|apiserver_admission_webhook_admission_duration_seconds|apiserver_flowcontrol_request_wait_duration_seconds|apiserver_flowcontrol_request_execution_seconds|workqueue_queue_duration_seconds|workqueue_work_duration_seconds|rest_client_request_duration_seconds|rest_client_rate_limiter_duration_seconds|rest_client_request_size_bytes|rest_client_response_size_bytes)_bucket'

defaultRules:
  rules:
    alertmanager: false
    general: true
    kubeApiserverAvailability: false
    kubeApiserverSlos: false
    kubeApiserverBurnrate: false
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    network: false
    prometheus: true
    prometheusOperator: true
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false
    etcd: false

grafana:
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
    accessModes: ["ReadWriteOnce"]
  adminPassword: "J2T9UY9RrlkAp-sj"
  nodeSelector:
    node-role.kubernetes.io/master: master
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.nasat.local
    path: /
    pathType: Prefix
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6

  livenessProbe:
    timeoutSeconds: 10
    
# Disable Alerting
alertmanager:
  enabled: false

# K3s Control Plane Disables
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
windowsMonitoring:
  enabled: false
kubeEtcd:
  enabled: false
kubeDns:
  enabled: false
coreDns:
  enabled: true

nodeExporter:
  enabled: true
  nodeSelector: {}
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 64Mi

# K3s Kubelet Scrape Configuration
kubelet:
  enabled: true
  namespace: kube-system
  serviceMonitor:
    https: true
    insecureSkipVerify: true

    cAdvisorMetricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: '(container_tasks_state|container_memory_failures_total|container_sockets|container_threads|container_blkio_device_usage|container_file_descriptors|container_cpu_load_average_10s|container_fs_reads_total|container_fs_writes_total|container_fs_inodes_total|container_spec_.*)'

# kubeStateMetrics:
#   enabled: false
