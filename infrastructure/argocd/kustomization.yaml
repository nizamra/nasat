apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - install.yaml
  - argocd-ingress.yaml

patches:
  # 1. Pin ALL Argo CD Deployments to worker-node
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: "argocd-.*"
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role.kubernetes.io/worker: worker

  # 2. Pin the Application Controller StatefulSet to worker-node
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: argocd-application-controller
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role.kubernetes.io/worker: worker

  # 3. Preserve the NodePort change
  - target:
      version: v1
      kind: Service
      name: argocd-server
    patch: |
      - op: add
        path: /spec/type
        value: NodePort

  # 4. Disable HTTPS redirect — serve UI over HTTP for local Traefik web entrypoint
  - target:
      version: v1
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"

  # 5. Enable Kustomize's Helm chart inflator (needed for the Longhorn preStop patch)
  - target:
      version: v1
      kind: ConfigMap
      name: argocd-cm
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        kustomize.buildOptions: "--enable-helm"