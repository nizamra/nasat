apiVersion: v1
kind: Service
metadata:
  name: paperless-ngx
  namespace: paperless
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: paperless-ngx
spec:
  type: ClusterIP
  selector:
    app: paperless-ngx
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
