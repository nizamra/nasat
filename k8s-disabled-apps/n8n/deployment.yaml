apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app: n8n
    tier: application
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  strategy:
    type: Recreate # Use Recreate since we use ReadWriteOnce PVC
  template:
    metadata:
      labels:
        app: n8n
        tier: application
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5678"
        prometheus.io/path: "/metrics"
    spec:
      # Ensure pods run on worker nodes only
      nodeSelector:
        node-role.kubernetes.io/worker: worker

      # Pod disruption budget for graceful shutdowns
      terminationGracePeriodSeconds: 30

      # Service account for potential cloud credentials
      serviceAccountName: n8n

      containers:
        - name: n8n
          image: n8nio/n8n:1.123.55
          imagePullPolicy: IfNotPresent

          # Security context - run as non-root where possible
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false

          ports:
            - name: http
              containerPort: 5678
              protocol: TCP

          # Load environment from ConfigMap and Secrets
          envFrom:
            - configMapRef:
                name: n8n-config
            - secretRef:
                name: n8n-secrets

          # Additional environment variables
          env:
            - name: NODE_ENV
              value: "production"
            - name: GENERIC_TIMEZONE
              value: "UTC"

          # Volume mounts
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
            - name: tmp
              mountPath: /tmp

          # Resource requests and limits
          # n8n is relatively lightweight but can spike during executions
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          # Startup probe: give n8n time to initialize (up to 5 minutes)
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10

          # Liveness probe: restart if unhealthy
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe: don't accept traffic until ready
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2

      # Volumes
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
