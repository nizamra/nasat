apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 84.5.0
      helm:
        valueFiles:
          - $values/infrastructure/monitoring/prometheus-values.yaml
    - repoURL: https://github.com/nizamra/nasat
      targetRevision: staging
      ref: values
    - repoURL: https://github.com/nizamra/nasat
      targetRevision: staging
      path: infrastructure/monitoring/dashboards-configmaps
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - pruneLast=true
      - ServerSideApply=true
